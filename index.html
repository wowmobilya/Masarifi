App.statement=function(id,range={from:'',to:Core.day()},limit=40){const a=this.account(id);if(!a)return;const s=this.accountStats(a,range),hidden=this.prefs.hideNumbers?'blurred':'';this.statementState={id,range:{...range},limit};const d=this.dialog(tr('accountHistory')+' — '+this.accountName(a),`<div class="stack"><p class="hint">${E(tr('statementScope'))}</p><div class="fields">${field(tr('from'),`<input id="statementFrom" type="date" value="${E(range.from)}">`)}${field(tr('to'),`<input id="statementTo" type="date" value="${E(range.to)}">`)}</div><div class="row">${btn('statementFilter',tr('filter'),'filter')}${btn('statementReset',tr('allTime'))}${btn('shareItem',tr('shareItem'),'share','primary',`data-kind="account" data-id="${E(id)}" data-statement="1"`)}${btn('openAccountReport','Excel / '+tr('reports'),'reports','',`data-id="${E(id)}"`)}</div><div class="statement-summary">${[['opening',s.opening],['income',s.income],['expense',s.expense],['transferIn',s.transferIn],['transferOut',s.transferOut],['closingBalance',s.closing]].map(([k,v])=>`<div><label>${E(tr(k))}</label><bdi class="${hidden}">${E(this.money(v,a.currency))}</bdi></div>`).join('')}</div><p class="hint ${hidden}">${E(tr('feesTotal'))}: <bdi>${E(this.money(s.fees,a.currency))}</bdi> · ${E(tr('count'))}: ${s.count}</p><div class="statement-list">${s.rows.slice().reverse().slice(0,limit).map(r=>`<article class="statement-entry"><div><h3 class="entry-desc">${E(r.description||tr(r.entryKind))}</h3><span class="entry-sub">${E(tr(r.entryKind))} · ${E(this.date(r.date))}<br>${E(r.transactionNumber)}</span></div><div class="entry-money ${hidden}"><bdi class="${r.signed<0?'expense':'income'}">${r.signed<0?'−':'+'} ${E(this.money(r.minor,r.currency))}</bdi><span class="entry-sub">${E(tr('balance'))}</span><bdi>${E(this.money(r.running,r.currency))}</bdi></div><div class="actions">${iconBtn(r.transferId?'transferDetails':'detail',tr('viewAll'),'records',`data-id="${E(r.transferId||r.id)}"`)}${iconBtn('shareItem',tr('shareItem'),'share',`data-kind="${r.transferId?'transfer':'transaction'}" data-id="${E(r.transferId||r.id)}"`)}</div></article>`).join('')||this.empty()}${s.count>limit?btn('statementMore',tr('more')):''}</div></div>`);d.classList.add('statement-dialog');d.addEventListener('close',()=>d.classList.remove('statement-dialog'),{once:true});};
App.reportsPage=function(){let html=V4.reportsPage.call(this);html=html.replace(/(<select id="reportKind">)[\s\S]*?(<\/select>)/,`$1${['transactions','notes','bank','account','transfers'].map(k=>option(k,tr({transactions:'records',notes:'notes',bank:'bankReport',account:'accountReport',transfers:'transferReport'}[k]),this.reportKind)).join('')}$2`);html=html.replace('<div id="reportStatus"',`<label class="check"><input type="checkbox" id="reportPhotos" ${this.includePhotos?'checked':''}>${E(tr('includePhotos'))}</label><p class="hint">${E(tr('excelPhotosHint'))}</p><div id="reportStatus"`);return html;};
App.moreMenu=function(){const d=$('#moreDialog');d.innerHTML=`<div class="dialog-head"><h2>${E(tr('moreMenu'))}</h2>${iconBtn('closeDialog',tr('close'),'close')}</div><div class="dialog-body"><div class="more-grid">${['notes','transfers','assistant','settings'].map(p=>btn('moreNavigate',tr(p),p==='transfers'?'transfer':p,'',`data-page="${p}"`)).join('')}${btn('manageAccounts',tr('accounts'),'wallet')}${btn('openRates',tr('rates'),'rates')}${btn('reminders',tr('reminders'),'bell')}${btn('calculator',tr('calculator'),'calc')}${btn('deviceGuide',tr('mobileGuide'),'records')}</div></div>`;if(!d.open)d.showModal();};
App.render=function(){V4.render.call(this);if(this.locked)return;document.documentElement.dataset.version='4';$('#header .brand small').textContent='PERSONAL FINANCE / V4';const reportsNav=$('#sidebar [data-page="reports"]');if(reportsNav)reportsNav.insertAdjacentHTML('beforebegin',btn('nav',tr('transfers'),'transfer','nav-btn '+(this.page==='transfers'?'active':''),'data-page="transfers"'));$('#sidebar [data-page="notes"]')?.classList.add('nav-desktop-only');if(this.page==='transfers'){const heading=$('#content .page-heading')?.outerHTML||'';$('#content').innerHTML=heading+this.transfersPage();}for(const b of $$('#sidebar [data-page]'))b.setAttribute('aria-current',b.dataset.page===this.page?'page':'false');if(this.page==='notes'){for(const n of this.notes){if(!n.photoIds?.length)continue;const edit=$(`#content [data-act="editNote"][data-id="${CSS.escape(n.id)}"]`);edit?.closest('.note-card')?.insertAdjacentHTML('beforeend',btn('recordPhotos',tr('attachments')+' · '+n.photoIds.length,'image','',`data-store="notes" data-id="${E(n.id)}"`));}}};
App.toast=function(message,error=false){$('#toast')?.remove();const el=document.createElement('div');el.id='toast';el.className='toast feedback-toast '+(error?'feedback-error':'feedback-success');el.setAttribute('role',error?'alert':'status');el.innerHTML=`<span class="feedback-symbol"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="${error?'M16 16 32 32 M32 16 16 32':'M13 24 21 32 35 17'}"/></svg></span><span>${E(message)}</span><button type="button" class="toast-close" aria-label="${E(tr('close'))}">${ico('close')}</button>`;el.querySelector('button').onclick=()=>el.remove();document.body.appendChild(el);setTimeout(()=>el.remove(),error?8500:4200);};
const priorError=App.error;App.error=function(err,target){priorError.call(this,err,target);if(target){target.classList.remove('error-pulse');void target.offsetWidth;target.classList.add('error-pulse');}};
// Only V4 actions are intercepted; V2/V3 delegated handlers continue unchanged.
window.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||App.locked)return;const a=b.dataset.act,id=b.dataset.id;const acts=['addAccount','removeAccount','addTransfer','addTransferFrom','transferDetails','cancelTransfer','openRates','refreshBankRates','openRateSource','rateXMLFile','pasteRateXML','rateBookShare','transferReport','openAccountReport','resetTransfers','moreTransfers','viewPhoto','recordPhotos'];if(!acts.includes(a))return;e.preventDefault();e.stopImmediatePropagation();if($('#moreDialog').open)$('#moreDialog').close();try{switch(a){case 'addAccount':App.accountForm();break;case 'removeAccount':App.removeAccount(id);break;case 'addTransfer':case 'addTransferFrom':App.transferForm(id);break;case 'transferDetails':App.transferDetails(id);break;case 'cancelTransfer':App.cancelTransfer(id);break;case 'openRates':Rates.dialog();break;case 'refreshBankRates':{b.disabled=true;const f=b.closest('dialog')?.querySelector('#ratesFeedback');if(f)f.textContent=tr('preparing');try{await Rates.fetch(b.dataset.provider);Rates.dialog(Rates.aux);}catch(err){if(f)f.textContent=tr(err.message);else App.error(err);}finally{b.disabled=false;}break;}case 'openRateSource':window.open(Rates.urls[b.dataset.provider],'_blank','noopener,noreferrer');break;case 'rateXMLFile':rateXMLInput.value='';rateXMLInput.click();break;case 'pasteRateXML':Rates.paste();break;case 'rateBookShare':ItemShare.open('rates',b.dataset.provider);break;case 'transferReport':App.page='reports';App.reportKind='transfers';App.invalidateReport();App.render();break;case 'openAccountReport':{const range=App.statementState?.id===id?App.statementState.range:{from:'',to:Core.day()};$('#dialog').close();App.page='reports';App.reportKind='account';App.filter={from:range.from||'',to:range.to||'',currency:App.account(id).currency,accountId:id,type:'all',categories:[],q:''};App.invalidateReport();App.render();break;}case 'resetTransfers':App.filter={from:'',to:'',currency:'all',accountId:'all',type:'all',categories:[],q:''};App.transferQuery='';App.transferStatus='all';App.render();break;case 'moreTransfers':App.transferLimit=(App.transferLimit||40)+40;App.render();break;case 'viewPhoto':await Photos.show(b.dataset.photo);break;case 'recordPhotos':{const r=App[b.dataset.store]?.find(x=>x.id===id);if(!r)break;App.dialog(tr('attachments'),`<div class="stack"><p>${E(r.text||r.description||'')}</p><div class="photo-grid detail-photos"></div>${btn('shareItem',tr('shareItem'),'share','primary',`data-kind="${b.dataset.store==='notes'?'note':'reminder'}" data-id="${E(id)}"`)}</div>`);await Photos.gallery($('#dialog .detail-photos'),r.photoIds||[]);break;}}}catch(err){App.error(err,b.closest('dialog')?.querySelector('.form-error'));}},true);
document.addEventListener('change',e=>{if(App.locked)return;if(e.target.id==='reportPhotos'){App.includePhotos=e.target.checked;App.invalidateReport();App.render();}if(e.target.id==='itemPhotos'){ItemShare.includePhotos=e.target.checked;}if(e.target.id==='transferStatus'){App.transferStatus=e.target.value;App.transferLimit=40;App.render();}});
let transferSearchTimer;document.addEventListener('input',e=>{if(e.target.id!=='transferSearch')return;const q=e.target.value;clearTimeout(transferSearchTimer);transferSearchTimer=setTimeout(()=>{App.transferQuery=q;if($('#transferResults'))$('#transferResults').innerHTML=App.transferCards(App.transfersView().slice(0,App.transferLimit||40));},180);});
</script>

V5.rateStrip=function(){const b=App.rateBooks.ecb;return `<section class="rates-strip"><div><span class="rate-icon">${ico('rates')}</span><b>${E(tr('v5Rates'))}</b><small>${E(b?(b.source||'ECB')+' · '+b.date:tr('v5NoRates'))}</small></div><div class="rate-quotes">${b?['USD','TRY'].filter(c=>b.rates[c]).map(c=>`<span><small>1 EUR</small><bdi>${E(b.rates[c])} ${c}</bdi></span>`).join(''):''}</div>${btn('openRates',tr('viewAll'),'arrow')}</section>`};
App.settingsPage=function(){const p=this.prefs;return `<form id="v5Settings" class="settings-layout"><section class="panel stack profile-panel"><h2>${E(tr('v5Profile'))}</h2><div class="profile-editor">${V5.avatar('large')}<div class="grow"><h3>${E(p.username||tr('app'))}</h3><p class="hint">${E(tr('v5ProfileHint'))}</p><div class="row">${btn('v5Photo',tr('v5Photo'),'camera')}${p.avatar?btn('v5RemovePhoto',tr('v5RemovePhoto'),'delete'):''}</div></div></div>${field(tr('username'),`<input name="username" maxlength="100" autocomplete="nickname" value="${E(p.username)}">`)}</section>
 <section class="panel stack"><h2>${E(tr('v5Appearance'))}</h2><div class="fields">${field(tr('language'),`<select name="language">${V5.langOptions(p.language)}</select>`)}${field(tr('theme'),`<select name="theme">${['light','dark','system'].map(k=>option(k,tr(k),p.theme)).join('')}</select>`)}${field(tr('fontSize'),`<input name="fontSize" type="range" min="13" max="20" value="${p.fontSize}">`)}<label class="check"><input type="checkbox" name="compact" ${p.compact?'checked':''}>${E(tr('v5Compact'))}</label>${field(tr('currency')+' · '+tr('personal'),`<select name="currencyPersonal">${this.assetOptions(p.currencyPersonal)}</select>`)}${field(tr('currency')+' · '+tr('work'),`<select name="currencyWork">${this.assetOptions(p.currencyWork)}</select>`)}</div></section>
 <section class="panel stack"><div class="row between"><h2>${E(tr('v5Periods'))}</h2><span class="badge">4 / 7</span></div><p class="hint">${E(tr('v5ChooseFour'))}</p>${V5.periodChoices()}<p class="hint">${E(tr('v5Rolling'))}</p></section>
 <section class="panel stack"><div class="row between"><h2>${E(tr('v5Security'))}</h2><span class="badge">${E(tr(this.lock?'v5SecurityOn':'v5SecurityOff'))}</span></div><div class="fields">${field(tr('v5AutoLock'),`<select name="idleMinutes">${[1,2,5,10,30].map(n=>option(String(n),n+' '+tr('v5Minute'),String(p.idleMinutes))).join('')}</select>`)}<label class="check"><input type="checkbox" name="lockOnLeave" ${p.lockOnLeave?'checked':''}>${E(tr('v5OnLeave'))}</label></div><div class="row">${btn('lockSettings',tr(this.lock?'edit':'enableLock'),'lock')}${this.lock?btn('lockNow',tr('lockNow'),'lock')+btn('disableLock',tr('disableLock')):''}</div><p class="hint">${E(tr('v5LockInfo'))}</p></section>
 <section class="panel stack"><h2>${E(tr('v5Rates'))}</h2><label class="check"><input type="checkbox" name="autoRates" ${p.autoRates?'checked':''}>${E(tr('v5AutoRates'))}</label>${field(tr('v5RateProvider'),`<select name="rateProvider">${option('ecb','ECB / BCE · Frankfurter',p.rateProvider)}${option('tcmb','TCMB · Frankfurter',p.rateProvider)}</select>`)}<p class="hint">${E(tr('v5RateHint'))}</p><p class="hint">${E(tr('v5ManualMetals'))}</p>${btn('openRates',tr('rates'),'rates')}</section>
 <section class="panel stack"><h2>${E(tr('v5Images'))}</h2>${field(tr('v5ImageQuality'),`<select name="imageQuality">${option('balanced',tr('v5Balanced'),p.imageQuality)}${option('high',tr('v5High'),p.imageQuality)}</select>`)}<p class="hint">${E(tr('v5ImageHint'))}</p></section>
 <div class="settings-save"><p class="form-error" role="alert"></p><button type="submit" class="primary">${ico('check')}${E(tr('save'))}</button></div></form>
 <div class="settings-layout"><section class="panel stack"><h2>${E(tr('v5Storage'))}</h2><p class="hint">${E(tr('v5StorageHint'))}</p><div id="storageStats" class="notice"></div><div class="row">${btn('persist',tr('persist'),'check')}${btn('backup',tr('backup'),'download','primary')}${btn('import',tr('import'),'records')}</div><details class="fold"><summary>${E(tr('legacy'))}</summary><div class="row">${btn('legacyImport',tr('legacy'))}${btn('legacyExport',tr('legacyExport'),'download')}${btn('beforeImport',tr('beforeImport'),'download')}</div></details><div class="row">${btn('trash',tr('trash'),'delete')}${btn('clearSection',tr('clearSection'),'delete','danger')}</div></section>
 <section class="panel stack"><h2>${E(tr('v5LocalAssistant'))}</h2><p class="hint">${E(tr('v5AssistantHint'))}</p><div class="row">${btn('nav',tr('assistant'),'assistant','','data-page="assistant"')}${btn('nav',tr('notes'),'notes','','data-page="notes"')}${btn('reminders',tr('reminders'),'bell')}${btn('budget',tr('budget'),'net')}</div><h3>${E(tr('v5Install'))}</h3><p class="hint">${E(tr('v5InstallHint'))}</p><span id="pwaStatus" class="badge">${E(V5.offlineLabel())}</span>${btn('v5Install',tr('v5Install'),'download')}<p class="tiny muted">Masarifi 5.0.1 · AR / TR / EN / FR / KU</p></section></div>`};
V5.periodChoices=()=>`<div class="period-choices">${V5.kinds.map(k=>`<label class="check"><input type="checkbox" name="periodCards" value="${k}" ${V5.periods(App.prefs.periodCards).includes(k)?'checked':''}>${E(tr(V5.labels[k]))}</label>`).join('')}</div>`;
V5.editPeriods=function(){App.dialog(tr('v5Periods'),`<p class="hint">${E(tr('v5ChooseFour'))}</p>${V5.periodChoices()}`,async f=>{const ps=f.getAll('periodCards');if(ps.length!==4)throw Error('v5ChooseFour');App.prefs.periodCards=ps;await App.prefsSave();App.render()})};
window.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||App.locked||!b.dataset.act.startsWith('v5'))return;e.preventDefault();e.stopImmediatePropagation();try{switch(b.dataset.act){case'v5Periods':V5.editPeriods();break;case'v5Period':App.page='records';App.filter={...V5.range(b.dataset.period),type:'expense',currency:'all',accountId:'all',categories:[],q:''};App.pageNumber=1;App.invalidateReport();App.render();break;case'v5Photo':V5.pickPhoto();break;case'v5RemovePhoto':App.prefs.avatar='';await App.prefsSave();App.render();break;case'v5Refresh':b.disabled=true;await Rates.fetch('ecb');Rates.dialog(Rates.aux);break;case'v5LegacyRates':V5.legacyRatesDialog(true);break;case'v5Install':await V5.install();break;case'v5AskBalance':App.page='assistant';await App.ask('balance');break;case'v5AskMonth':App.page='assistant';await App.ask(tr('v5Month'),{kind:'summary',range:V5.range('month')});break;case'v5Update':for(const d of $$('dialog[open]'))d.close();V5.waitingWorker?.postMessage({type:'ACTIVATE'});break;}}catch(err){App.error(err,b.closest('dialog')?.querySelector('.form-error'))}finally{b.disabled=false}},true);
document.addEventListener('submit',async e=>{if(e.target.id!=='v5Settings')return;e.preventDefault();if(App.locked)return;const f=new FormData(e.target),b=e.target.querySelector('[type=submit]');b.disabled=true;try{if(f.getAll('periodCards').length!==4)throw Error('v5ChooseFour');const oldProvider=App.prefs.rateProvider;App.prefs=safePrefs({...App.prefs,username:f.get('username').trim(),language:f.get('language'),theme:f.get('theme'),fontSize:Number(f.get('fontSize')),currencyPersonal:f.get('currencyPersonal'),currencyWork:f.get('currencyWork'),periodCards:f.getAll('periodCards'),compact:f.has('compact'),autoRates:f.has('autoRates'),lockOnLeave:f.has('lockOnLeave'),idleMinutes:Number(f.get('idleMinutes')),imageQuality:f.get('imageQuality'),rateProvider:f.get('rateProvider')},App.prefs);await App.prefsSave();if(oldProvider!==App.prefs.rateProvider)V5.rateAttempt=0;App.invalidateReport();App.render();App.toast(tr('saved'));V5.maybeRates?.()}catch(err){App.error(err,e.target.querySelector('.form-error'))}finally{b.disabled=false}});
const v5ReportsPage=App.reportsPage;App.reportsPage=function(){return v5ReportsPage.call(this).replace(/(<select id="reportLang"[^>]*>)[\s\S]*?<\/select>/,`$1${V5.langOptions(this.prefs.reportLanguage)}</select>`)};
// Browser theme changes are reflected without reopening the app.
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(App.prefs.theme==='system'&&!App.locked)App.render()});


const v5LoadCategories=App.load;App.load=async function(){await v5LoadCategories.call(this);for(const c of this.categories){if(V5Categories[c.id]){c.labels.fr??=V5Categories[c.id][0];c.labels.ku??=V5Categories[c.id][1]}}};

// Build secondary analytics only when opened, keeping the first screen inexpensive.
V5.drawAnalytics=function(){const el=$('#v5AnalyticsBody');if(!el)return;const rows=Core.filter(App.financialRows(),{section:App.prefs.section,...V5.range('month')});el.innerHTML=`<div class="spacer"></div><p class="hint">${E(tr('v5Rolling'))}</p><div class="grid2"><section class="panel"><h3>${E(tr('byCategory'))}</h3><div class="row"><select id="v5ChartCurrency" aria-label="${E(tr('currency'))}">${[...new Set([App.prefs.section==='work'?App.prefs.currencyWork:App.prefs.currencyPersonal,...rows.map(r=>r.currency)])].map(c=>option(c,App.assetLabel(c),V5.chartCurrency||'')).join('')}</select><select id="chartType" aria-label="${E(tr('analytics'))}">${['pie','bar','line','bubble'].map(c=>option(c,tr(c),App.chartType)).join('')}</select><select id="chartKind" aria-label="${E(tr('type'))}">${['expense','income'].map(c=>option(c,tr(c),App.chartKind)).join('')}</select></div><canvas id="chart" class="financial-chart"></canvas><div id="chartLegend" class="chart-legend"></div><details class="fold"><summary>${E(tr('viewAll'))}</summary>${App.categoryTotals(rows)}</details></section><section class="panel">${App.insights(rows)}</section></div>`;V5.chartCurrency=$('#v5ChartCurrency').value;App.drawChart()};
const v5Chart=App.drawChart;App.drawChart=function(){if(this.page!=='home'||!$('#v5Analytics'))return v5Chart.call(this);const f=this.filter;this.filter={...V5.range('month'),accountId:'all',currency:V5.chartCurrency||this.prefs.currencyPersonal,type:'all',categories:[],q:''};try{return v5Chart.call(this)}finally{this.filter=f}};
document.addEventListener('toggle',e=>{if(e.target.id==='v5Analytics'&&e.target.open&&!$('#v5AnalyticsBody').children.length)V5.drawAnalytics()},true);
document.addEventListener('change',e=>{if(e.target.id==='v5ChartCurrency'){V5.chartCurrency=e.target.value;App.drawChart()}});
</script>
<script data-module="v5-services.js">'use strict';
V5.legacyRatesDialog=Rates.dialog.bind(Rates);
Rates.fetch=async function(provider='ecb'){
 if(provider!=='ecb')return V5.fetchLegacyRate(provider);
 if(V5.ratePending)return V5.ratePending;
 V5.ratePending=(async()=>{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{
  const p=App.prefs.rateProvider||'ecb',url='https://api.frankfurter.dev/v2/rates?base=EUR&providers='+p;
  const r=await fetch(url,{signal:ctrl.signal,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('v5RateFailed');
  const text=await r.text();if(text.length>150000)throw Error('invalidRate');const book=V5.rateBook(JSON.parse(text),p);book.url=url;
  await DB.put('meta',{id:'rateBook:ecb',value:book});App.rateBooks.ecb=book;App.channel?.postMessage('rates');return book;
 }catch(e){throw Error(e.message==='invalidRate'?'invalidRate':'v5RateFailed')}finally{clearTimeout(timer);V5.ratePending=null}})();return V5.ratePending;
};
V5.fetchLegacyRate=async provider=>{if(!['ecb','tcmb'].includes(provider))throw Error('invalidXML');const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),12000);try{const r=await fetch(Rates.urls[provider],{signal:ctrl.signal,credentials:'omit'});if(!r.ok)throw Error('rateFetchFailed');const b=Rates.parse(await r.text(),'direct');await Rates.save(b);return b}finally{clearTimeout(t)}};
Rates.dialog=function(aux=false){this.aux=aux;const b=App.rateBooks.ecb;App.dialog(tr('v5Rates'),`<div class="stack"><div class="row between">${V5.netBadge()}<span class="badge">${E(b?tr('v5SavedRates'):tr('v5NoRates'))}</span></div><p class="hint">${E(tr('v5RateHint'))}</p><section class="rate-source"><h3>${E(b?.source||App.prefs.rateProvider.toUpperCase()+' · Frankfurter')}</h3><p>${E(tr('quoteDate'))}: <bdi>${E(b?.date||'—')}</bdi></p><p class="hint">${E(tr('v5LastUpdate'))}: <bdi>${E(b?.fetchedAt?.replace('T',' ')||'—')}</bdi>${b?.origin==='imported'?' · '+E(tr('importedSource')):''}</p><div class="row">${btn('v5Refresh',tr('v5Refresh'),'refresh','primary')}${b?btn('rateBookShare',tr('shareItem'),'share','','data-provider="ecb"'):''}</div></section>${b?`<div class="rate-table">${Object.entries(b.rates).filter(([c])=>Core.currencies.includes(c)).map(([c,v])=>`<div class="metric"><b>${E(c)}</b><bdi>1 EUR = ${E(v)} ${E(c)}</bdi></div>`).join('')}</div>`:''}<p class="hint">${E(tr('v5ManualMetals'))}</p><details class="fold"><summary>TCMB / ECB · XML</summary><p class="hint">${E(tr('ratePolicy'))}</p><div class="row">${btn('rateXMLFile',tr('importXML'),'records')}${btn('pasteRateXML',tr('pasteXML'),'copy')}${btn('v5LegacyRates',tr('viewAll'),'rates')}</div></details><p class="form-error" id="ratesFeedback" role="status"></p></div>`,null,aux)};
V5.maybeRates=async function(){if(!App.ready||App.locked||!App.prefs.autoRates||!navigator.onLine||Date.now()-(V5.rateAttempt||0)<3600000)return;const book=App.rateBooks.ecb;if(book?.upstream===App.prefs.rateProvider&&Date.now()-(book.fetchedAtMs||0)<21600000)return;V5.rateAttempt=Date.now();try{await Rates.fetch('ecb');if(App.page==='home'&&!App.locked&&!$('dialog[open]'))App.render()}catch{ /* Keep prior validated data and its original timestamp. */ }};
for(const event of ['online','offline'])window.addEventListener(event,()=>{for(const el of $$('.connection'))el.outerHTML=V5.netBadge();if(event==='online'){V5.rateAttempt=0;V5.maybeRates()}});
Photos.compress=async function(file){
 if(!file||file.size>20*1024*1024)throw Error('photoLarge');if(!/^image\/(jpeg|png|webp|heic|heif|avif)$/i.test(file.type))throw Error('photoInvalid');
 const url=URL.createObjectURL(file);let canvas;try{const im=await Photos.decode(url),w=im.naturalWidth,h=im.naturalHeight;if(!w||!h||w*h>80000000)throw Error('photoLarge');const high=App.prefs.imageQuality==='high',max=high?2000:1600,scale=Math.min(1,max/Math.max(w,h));canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingQuality='high';ctx.drawImage(im,0,0,canvas.width,canvas.height);let data,quality=high?.88:.8;const target=high?1250000:720000;do{data=canvas.toDataURL('image/jpeg',quality);quality-=.08}while(data.length>target&&quality>=.56);if(data.length>Photos.maxEncoded)throw Error('photoLarge');return{id:uuid(),name:String(file.name||'photo').slice(0,195),mime:'image/jpeg',width:canvas.width,height:canvas.height,data,createdAt:Core.local()}}finally{URL.revokeObjectURL(url);if(canvas)canvas.width=canvas.height=1}
};
V5.pickPhoto=function(){const input=document.createElement('input');input.type='file';input.accept='image/jpeg,image/png,image/webp,image/avif';input.hidden=true;document.body.appendChild(input);V5.pickingUntil=Date.now()+120000;input.oncancel=()=>{V5.pickingUntil=0;input.remove()};input.onchange=async()=>{try{if(!input.files[0]||App.locked)return;const p=await Photos.compress(input.files[0]),im=await Photos.decode(p.data),c=document.createElement('canvas'),scale=Math.min(1,512/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const avatar=c.toDataURL('image/jpeg',.84);c.width=c.height=1;if(avatar.length>=400000)throw Error('photoLarge');App.prefs.avatar=avatar;await App.prefsSave();App.render();App.toast(tr('saved'))}catch(err){App.error(err)}finally{V5.pickingUntil=0;input.remove()}};input.click()};
window.addEventListener('click',e=>{if(['photoCamera','photoGallery'].includes(e.target.closest('[data-act]')?.dataset.act))V5.pickingUntil=Date.now()+120000},true);
document.addEventListener('change',e=>{if(e.target.matches('input[type=file]'))V5.pickingUntil=0});
V5.lastActivity=Date.now();V5.securityState={failures:0,until:0};
V5.readAttempts=()=>{try{const p=JSON.parse(localStorage.getItem('masarifi-lock-attempts')||'{}');return{failures:Math.max(0,Number(p.failures)||0),until:Math.max(0,Number(p.until)||0)}}catch{return V5.securityState}};
V5.writeAttempts=s=>{V5.securityState=s;try{localStorage.setItem('masarifi-lock-attempts',JSON.stringify(s))}catch{}};

  function formatResult(data, app, t) {
    const money=(n,c)=>app.prefs.hideNumbers?'••••':app.money(n,c);
    const heading=[t('smartSource'),`${data.range.from||t('allTime')} → ${data.range.to||day(new Date())}`];
    if(data.kind==='balance'){
      heading.push(t('smartBalanceScope'));
      for(const {account,ledger}of data.accounts)heading.push('\n'+app.accountName(account)+' · '+account.currency+'\n'+t('smartBalance')+': '+money(ledger.closing,account.currency));
      if(!data.accounts.length)heading.push(t('smartNoAccounts'));
      return heading.join('\n');
    }
    if(data.kind==='budget'){
      heading.push(t(data.section),t('smartBudgetScope'));
      for(const b of data.budgets)heading.push('\n'+b.currency+'\n'+t('budget')+': '+money(b.limit,b.currency)+'\n'+t('expenseTotal')+': '+money(b.spent,b.currency)+'\n'+t('budgetRemaining')+': '+money(b.remaining,b.currency));
      if(!data.budgets.length)heading.push(t('smartNoBudget'));
      return heading.join('\n');
    }
    heading.push(t(data.filter.section),data.filter.accountId==='all'?t('smartAllAccounts'):app.accountName(data.filter.accountId));
    if(data.filter.categories.length)heading.push(t('smartCategories')+': '+data.filter.categories.map(id=>app.category(id)).join('، '));
    heading.push(t('smartScope'),t('count')+': '+data.rows.length);
    for(const [currency,v]of Object.entries(data.summary)){
      heading.push('\n'+(app.assetLabel?app.assetLabel(currency):currency));
      if(data.kind!=='largest')heading.push(t('incomeTotal')+': '+money(v.income,currency),t('expenseTotal')+': '+money(v.expense,currency),t('smartNet')+': '+money(v.net,currency));
      if(data.kind==='largest'){
        heading.push(t('smartLargest'));
        for(const r of data.top[currency])heading.push(`${r.date.slice(0,10)} · ${r.description} · ${money(r.minor,currency)}`);
      }
    }
    if(!data.rows.length)heading.push(t('noData'));
    return heading.join('\n');
  }
  function install(env) {
    const {App:app,Core:C,Bank:B,TEXT:dictionary,DB:db,document:doc,tr:t}=env;

    async function respond(text,answer){app.chat.push({role:'user',text},{role:'assistant',text:answer});await db.put('meta',{id:'chat',value:app.chat});app.render();}
    app.ask=async function(text,forced=null){

        await respond(text,t(key));return;
      }
      if(p.kind==='add'){
        this._smartContext=null;
        const account=this.accounts.find(a=>a.id===p.accountId);
        if(account&&p.currency&&account.currency!==p.currency){await respond(text,t('smartNeedCurrency'));return;}
        const currency=p.currency||account?.currency||(this.prefs.section==='work'?this.prefs.currencyWork:this.prefs.currencyPersonal);
        try{C.minor(p.amount,currency,this.prefs.language);}catch{await respond(text,t('smartNeedAmount'));return;}
        // Delegate to the established, user-confirmed form. Only chat is saved here.
        await previousAsk.call(this,text,p);
        const form=doc?.querySelector('#dialog #mainForm');
        if(form?.querySelector('#txAmount')){
          const date=form.querySelector('[name=date]');if(date&&p.date)date.value=p.date+'T'+C.local().slice(11,16);
          const category=form.querySelector('#txCategory');
          if(category&&p.categories?.length===1&&[...category.options].some(o=>o.value===p.categories[0])){category.value=p.categories[0];form.dataset.categoryTouched='1';}

      if(['language','theme','note'].includes(p.kind)){this._smartContext=null;return previousAsk.call(this,text,p);}
      if(p.kind==='help'){
        const legacy=C.intent(text);
        if(['theme','language','note','report'].includes(legacy.kind))return previousAsk.call(this,text,legacy);

        await respond(text,t('smartHelp'));return;
      }
      if(readable.has(p.kind)){
        p={...p,section:p.section||this.prefs.section,accountId:p.accountId||this.filter.accountId||'all'};
        this._smartContext={...p};
        if(p.kind==='report'){

        }
        const result=analyze(p,{rows:this.rows,transfers:this.transfers,accounts:this.accounts,section:this.prefs.section,budget:this.prefs.budget},{Core:C,Bank:B});
        await respond(text,formatResult(result,this,t));return;
      }
      return previousAsk.call(this,text,p);
    };
